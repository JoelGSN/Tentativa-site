<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Móveis</title>
  <script src="js/app.js" defer></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="layout-site">
    <aside class="barra-lateral-esquerda">
      <nav class="menu-vertical">
        <ul>
          <ul><a href="index.html">🏠 Início</a></ul>
          <ul><a href="clientes.html" class="ativo">👥 Clientes</a></ul>
          <ul><a href="produto.html">📦 Produtos</a></ul>
          <ul><a href="relatorio.html">📊 Relatorios</a></ul>
        </ul>
      </nav>
    </aside>



    <main>
      <h1>Menu de Cadastro | Alterações de Clientes</h1>
      <section>
        <form id="cdclientes">
          <ul><a>Cadastro de Cliente</a></ul>
          <input class="inputcadcl" id='nomec' type="text">
          <ul><a>CPF | CNPJ</a></ul>
          <input class="inputcadcl" id='cpf' type="num" minlength="11" maxlength="14">
          <ul><a>Endereço</a></ul>
          <input class="inputcadcl" id='rua' type="text">
          <ul><a>Numero</a></ul>
          <input class="inputcadcl" id='numero' type="text">
          <ul><a>UF</a></ul>
          <input class="inputcadcl" id='uf' type="text">
          <br>
          <br>
          <br>
          <section id="btncadcliente">
            <button type="button" class="botaogeral" onclick="cli()">Salvar Cliente</button>
            <section id="mid">
              <button type="button" class="botaogeral" onclick="buscliente()">Buscar Cliente Por CPF | CNPJ</button>
              <button type="button" class="botaogeral" onclick="alterarcl()">Editar Cliente</button>
            </section>
            <button type="button" class="botaogeral" onclick="clidelete()">Deletar Cliente</button>
            <br>
          </section>
        </form>
      </section>

      <div class="principal" id="lista-cliente"></div>

    </main>
  </div>

</body>

</html>
