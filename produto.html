<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Móveis</title>
  <script src="frontend/js/app.js" defer></script>
  <link rel="stylesheet" href="frontend/css/style.css">
</head>
<body>
  <div class="layout-site">
    <aside class="barra-lateral">
      <nav class="menu-vertical">
        <ul>
          <li><a href="index.html">🏠 Início</a></li>
          <li><a href="clientes.html">👥 Clientes</a></li>
          <li><a href="produto.html" class="ativo">📦 Produtos</a></li>
          <li><a href="relatorio.html">📊 Relatorios</a></li>
        </ul>
      </nav>
    </aside>
    <main>
      <h1>Menu de Cadastro | Alterações</h1>
      <form id="form_cadp">
          <li><a class="nome_inputs">Cadastro de Produto</a></li>
          <input class="inputcadcl" id='nomep' type="text">
          <li><a class="nome_inputs">Tipo do Produto</a></li>
          <input class="inputcadcl" id='tipo' type="text">
          <li><a class="nome_inputs">Cor do Produto</a></li>
          <input class="inputcadcl" id='cor' type="text">
          <li><a class="nome_inputs">Preco</a></li>
          <input class="inputcadcl" id='preco' type="text">
          <li><a class="nome_inputs">Quantidade</a></li>
          <input class="inputcadcl" id='quantidade' type="text">
          <br>
          <br>
          <br>
          <section class="btncontainer">
            <button type="button" class="botaogeral" onclick="pro()">Cadastrar Produto</button>
          </section>
      </form>
      <br>
      <h2>Compra de Produto | Venda de Produto</h2>
      <form id="compravenda">
        <br>
          <li><a class="nome_inputs">Nome do Produto</a></li>
          <input class="inputcadcl" id='nomecv' type="text">
          <li><a class="nome_inputs">Quantidade</a></li>
          <input class="inputcadcl" id='quantidadecv' type="number">
          <br>
          <br>
          <br>
          
          <section class="btncontainer">
            <button type="button" class="botaogeral" onclick="comprapd()">Comprar Produto</button>
            <button type="button" class="botaogeral" onclick="venderpd()">Vender Produto</button>
          </section>
      </form>
      <div class="principal" id="lista-produto"></div>
    </main>
  </div>

</body>

</html>
