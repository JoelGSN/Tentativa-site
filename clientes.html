<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Móveis</title>
  <script src="frontend/js/app.js" defer></script>
  <link rel="stylesheet" href="frontend/css/style.css">
</head>
<body>
  <div class="layout-site">
    <aside class="barra-lateral">
      <nav class="menu-vertical">
        <ul>
          <li><a href="index.html">🏠 Início</a></li>
          <li><a href="clientes.html" class="ativo">👥 Clientes</a></li>
          <li><a href="produto.html">📦 Produtos</a></li>
          <li><a href="relatorio.html">📊 Relatorios</a></li>
        </ul>
      </nav>
    </aside>
    <main>
      <h1>Menu de Cadastro | Alterações de Clientes</h1>
        <form id="cdclientes">
          <li><a class="nome_inputs">Cadastro de Cliente</a></li>
          <input class="inputcadcl" id='nomec' type="text">
          <li><a class="nome_inputs">CPF | CNPJ</a></li>
          <input class="inputcadcl" id='cpf' type="num" minlength="11" maxlength="14">
          <li><a class="nome_inputs">Endereço</a></li>
          <input class="inputcadcl" id='rua' type="text">
          <li><a class="nome_inputs">Numero</a></li>
          <input class="inputcadcl" id='numero' type="text">
          <li><a class="nome_inputs">UF</a></li>
          <input class="inputcadcl" id='uf' type="text">
          <br>
          <br>
          <br>
          <section class="btncontainer">
            <button type="button" class="botaogeral" onclick="cli()">Salvar Cliente</button>
            <section id="mid">
              <button type="button" class="botaogeral" onclick="buscliente()">Buscar Cliente Por CPF | CNPJ</button>
              <button type="button" class="botaogeral" onclick="alterarcl()">Editar Cliente</button>
            </section>
            <button type="button" class="botaogeral" onclick="clidelete()">Deletar Cliente</button>
            <br>
          </section>
        </form>
      <div class="principal" id="lista-cliente"></div>
    </main>
  </div>
</body>
</html>
